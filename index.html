<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEB VULNERADA</title>
    <style>
        body {
            background-color: #0a0a0a;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        .container {
            text-align: center;
            padding: 20px;
            border: 2px solid #ff003c;
            box-shadow: 0 0 20px rgba(255, 0, 60, 0.3), inset 0 0 20px rgba(255, 0, 60, 0.1);
            background: rgba(10, 10, 10, 0.8);
            border-radius: 10px;
        }

        h1 {
            color: #ff003c;
            font-size: 4rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin: 0 0 20px 0;
            text-shadow: 0 0 10px #ff003c, 0 0 30px #ff003c;
            animation: glitch 1s linear infinite;
        }

        p {
            font-size: 1.5rem;
            color: #e0e0e0;
            max-width: 700px;
            line-height: 1.5;
            margin: 0 auto 40px auto;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }

        .signature {
            font-size: 2.2rem;
            font-weight: bold;
            color: #00ffea;
            text-shadow: 0 0 15px #00ffea, 0 0 30px #00ffea;
            letter-spacing: 2px;
            animation: pulse 2s infinite;
        }

        /* Animación estilo Glitch para el título */
        @keyframes glitch {
            2%, 64% { transform: translate(2px, 0) skew(0deg); }
            4%, 60% { transform: translate(-2px, 0) skew(0deg); }
            62% { transform: translate(0, 0) skew(5deg); }
        }

        /* Animación de pulso para la firma */
        @keyframes pulse {
            0% { opacity: 0.8; }
            50% { opacity: 1; text-shadow: 0 0 20px #00ffea, 0 0 40px #00ffea; }
            100% { opacity: 0.8; }
        }

        /* Efecto de líneas de escaneo de monitor antiguo de fondo */
        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Web Vulnerada</h1>
        <p>Asegure su web antes que suceda algo que los perjudique.</p>
        <div class="signature">ATT: VIBE CODING</div>
    </div>
</body>
</html>
